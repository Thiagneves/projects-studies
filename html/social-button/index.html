<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <title>Social Media Icons</title>
</head>
<body>
    <div class="wrapper">

        <div class="button">
            <div class="icon"><i class="fa-brands fa-facebook-f"></i></div>
            <span>Facebook</span>
        </div>

        <div class="button">
            <div class="icon"><i class="fa-brands fa-twitter"></i></div>
            <span>Twitter</span>
        </div>

        <div class="button">
            <div class="icon"><i class="fa-brands fa-instagram"></i></div>
            <span>Instagram</span>
        </div>

        <div class="button">
            <div class="icon"><i class="fa-brands fa-github"></i></div>
            <span>Github</span>
        </div>

        <div class="button">
            <div class="icon"><i class="fa-brands fa-youtube"></i></div>
            <span>YouTube</span>
        </div>

    </div>

    <div class="wrapper1">

        <div class="icon facebook">
            <div class="tooltip">Facebook</i></div>
            <span><i class="fab fa-facebook-f"></i></span>
        </div>

        <div class="icon twitter">
            <div class="tooltip">Twitter</i></div>
            <span><i class="fab fa-twitter"></i></span>
        </div>

        <div class="icon instagram">
            <div class="tooltip">Instagram</i></div>
            <span><i class="fab fa-instagram"></i></span>
        </div>

        <div class="icon github">
            <div class="tooltip">Github</i></div>
            <span><i class="fab fa-github"></i></span>
        </div>

        <div class="icon youtube">
            <div class="tooltip">YouTube</i></div>
            <span><i class="fab fa-youtube"></i></span>
        </div>
    </div>
</body>
</html>
